<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
    <style>
        table{
            width: 100%;
            border-collapse: collapse;
            color:black;
        }
        td,th{
            border: 1px solid black;
            padding: 10px;
        }
        tr:nth-child(even){
            background-color: #838383;
        }
    </style>
</head>
<body>
   <table>
    <colgroup>
        <col span="2" style="background-color: aquamarine;"/>
    </colgroup>
    <tr>
        <th>Country</th>
        <th>Code</th>
        <th>mail</th>
    </tr>
    <tr>
        <td>India</td>
        <td>IN</td>
        <td>in@gmal.com</td>
    </tr>
    <tr>
        <td>United state of america</td>
        <td>usa</td>
        <td>usa@gmal.com</td>
    </tr>
    <tr>
        <td>Japan</td>
        <td>jp</td>
        <td>jp@gmal.com</td>
    </tr>
   </table>
   <table style="width: 50%;">
    <tr>
        <th colspan="3">Country</th>
        <td>India</td>
        <td>China</td>
        <td>japan</td>
    </tr>
    <tr>
        <th>code</th>
        <td>IN</td>
        <td>CN</td>
        <td>JP</td>
    </tr>
   </table>
</body>
</html>
